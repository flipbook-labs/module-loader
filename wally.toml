[package]
name = "flipbook-labs/module-loader"
description = "Module loader class that bypasses Roblox's require cache"
version = "0.13.0"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = ["*"]
include = [
    "dist",
    "dist/**",
    "default.project.json",
    "LICENSE",
    "README.md",
    "wally.toml",
]

[dependencies]

#[dev-dependencies]
Jest = "roblox/jest@3.21.0"
JestGlobals = "roblox/jest-globals@3.21.0"
